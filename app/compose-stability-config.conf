// Compose 稳定性配置文件
// v27.5 性能修复（用户连续多轮反馈"所有界面上下滑动都卡"）：
// AppContainer / SettingsStore / FavoritesStore 等依赖容器是普通 class（非 data class），
// Compose 编译器默认推断为 Unstable，导致所有以 container 为参数的屏幕根 Composable
// 都被标记为 non-skippable——即使其内部状态未变，每次父组件（NavHost）重组时也必须完整重组。
// 这是"所有界面始终卡"的致命根因之一。
// 此配置文件告诉 Compose 编译器：这些类的内容在 App 生命周期内不会变化，应视为 Stable。
// 配置语法：每行一个全限定类名，// 开头为注释。

com.jmreader.data.AppContainer
com.jmreader.data.local.SettingsStore
com.jmreader.data.local.FavoritesStore
com.jmreader.data.local.HistoryStore
com.jmreader.data.local.BrowseHistoryStore
com.jmreader.data.local.SearchHistoryStore
com.jmreader.data.local.BlockedTagsStore
com.jmreader.data.repository.JMRepository
com.jmreader.data.api.direct.JmDirectClient
com.jmreader.data.download.DownloadManager
com.jmreader.data.api.saucenao.SaucenaoService
com.jmreader.JMApp
com.jmreader.MainActivity
com.jmreader.core.CoilSetup
com.jmreader.core.CrashHandler
com.jmreader.core.Logger

// v27.12 根因修复（滑动卡顿反复出现的真正根因）：
// List / Set / Map 是 Kotlin 接口类型，Compose 编译器默认推断为 Unstable
// （因为接口可能有可变实现，如 MutableList）。
//
// 这导致 ListUiState（含 items: List<ComicBriefDto>）被标记为 unstable class →
// HomeScreen 无法跳过重组 → 每次 _state.value 更新（enrich 200ms 一次/loadMore/refresh）
// 都触发整个列表的完整重组 → LazyColumn 重新组合所有可见 ComicCard → 掉帧。
//
// 之前的优化（applyBlock 切 Default、TagChipsRow 改 Row、ColorPainter remember 等）
// 只是减少了单次重组的开销，但无法阻止重组本身发生——所以"修了又出现"。
//
// 声明 List/Set/Map 为 stable 后，只要内容相同（equals 返回 true），Compose 就能跳过重组。
// 安全性：本项目中所有传给 Composable 的集合都是不可变的（API 返回的 List、listOf()、
// filterNot 返回的新 List），不会在 Composable 内部被修改。
java.util.List
java.util.ArrayList
java.util.Set
java.util.HashSet
java.util.Map
java.util.HashMap
kotlin.collections.List
kotlin.collections.Set
kotlin.collections.Map
kotlin.collections.Collection
kotlin.collections.Iterable
